[project]
name = "multi-agenti-conversation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swatantra Jain" }
]
requires-python = ">=3.14.0"
dependencies = [
    "a2a-sdk[http-server]>=1.3,<1.4",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.4,<2",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "langchain[mcp]>=1.4.6",
    "langfuse>=5.2,<6",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp[cli]>=2.3.0",
    "pinecone>=10.3,<11",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.24.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
]

[project.scripts]
multi-agenti-conversation-system = "multi_agenti_conversation_system:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode="auto"
# Unit tests by default; `-m integration` talks to Aiven/Pinecone, `-m live` to paid APIs.
addopts = "-m 'not integration and not live'"
markers = [
    "integration: needs the cloud services in .env (Aiven, Pinecone)",
    "live: calls an LLM or embedding API",
]
