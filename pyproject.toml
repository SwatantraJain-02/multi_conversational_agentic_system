[project]
name = "multi-agenti-conversation-system"
version = "0.1.0"
description = "Multi-agent chatbot (LangGraph + MCP) that answers web, database and hybrid questions"
readme = "README.md"
authors = [
    { name = "Swatantra Jain" }
]
requires-python = ">=3.14.0"
dependencies = [
    "chromadb>=1.0,<1.1",
    "httpx>=0.28.1",
    "langchain-chroma>=1.0.0",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langchain[mcp]>=1.4.6",
    "langgraph>=1.2.15",
    "mcp[cli]>=2.3.0",
    "ollama>=0.6.3",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.24.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
db-mcp-server = "multi_agenti_conversation_system.mcp.servers.db_server.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Plain `pytest` runs only the offline unit tests. Opt in with -m integration / -m live.
addopts = "-m 'not integration and not live'"
markers = [
    "integration: needs the docker compose services (Postgres, Chroma)",
    "live: calls external model APIs (OpenRouter, Ollama)",
]
