  expect: {citations: true}

# ----------------------------------------------------------------------------- complex
- id: c01
  category: complex
  question: What is our total revenue by year, after discounts?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT EXTRACT(YEAR FROM o.order_date)::int, SUM(od.unit_price * od.quantity * (1 - od.discount))
    FROM orders o JOIN order_details od ON od.order_id = o.order_id GROUP BY 1
- id: c02
  category: complex
  question: Which country has the most customers?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: SELECT country FROM customers GROUP BY country ORDER BY COUNT(*) DESC LIMIT 1
- id: c03
  category: complex
  question: How many orders did each employee handle? Show their first and last names.
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT e.first_name, e.last_name, COUNT(*) FROM orders o
    JOIN employees e ON e.employee_id = o.employee_id GROUP BY e.employee_id, e.first_name, e.last_name
- id: c04
  category: complex
  question: What is the total quantity sold for each product category?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT c.category_name, SUM(od.quantity) FROM order_details od
    JOIN products p ON p.product_id = od.product_id
    JOIN categories c ON c.category_id = p.category_id GROUP BY c.category_name
- id: c05
  category: complex
  question: Which shipping company carried the most orders?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT s.company_name FROM orders o JOIN shippers s ON s.shipper_id = o.ship_via
    GROUP BY s.company_name ORDER BY COUNT(*) DESC LIMIT 1
- id: c06
  category: complex
  question: Which German customers have placed more than 10 orders?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT c.company_name FROM customers c JOIN orders o ON o.customer_id = c.customer_id
    WHERE c.country = 'Germany' GROUP BY c.company_name HAVING COUNT(*) > 10

