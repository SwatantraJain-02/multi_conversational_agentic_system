# ---------------------------------------------------------------------------------- cache
# The first must NOT be served from the entry for product 10 (the entity key differs); the
# second is a paraphrase of a cached question and MUST be.
- id: x01
  category: cache
  prime: Show the details of the product with product_id 10
  question: Show the details of the product with product_id 20
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: >-
    SELECT p.product_id, p.product_name, c.category_name, s.company_name, p.quantity_per_unit,
    p.unit_price, p.units_in_stock, p.units_on_order, p.reorder_level, p.discontinued
    FROM products p JOIN categories c ON c.category_id = p.category_id
    JOIN suppliers s ON s.supplier_id = p.supplier_id WHERE p.product_id = 20
  expect: {cache_hit: false}
- id: x02
  category: cache
  prime: How many orders were placed in 2025?
  question: Number of orders placed during 2025
  expected_intent: cached
  expected_agents: []
  expect: {cache_hit: true}
