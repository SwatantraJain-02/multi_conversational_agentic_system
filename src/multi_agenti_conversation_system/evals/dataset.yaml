# The evaluation dataset (Phase K): 39 cases in 7 categories.
#
# Each case:
#   id, category, question
#   setup:            user messages sent first (same user), e.g. a statement to be remembered
#   prime:            a question asked first and left in the semantic cache (cache cases)
#   expected_intent:  one intent, a list of acceptable ones, or `any`
#   expected_agents:  agents that must have been used ([] = none may be used)
#   gold_sql:         the query whose RESULT SET the agent's SQL must reproduce (not its text)
#   required_facts:   lower-case substrings the answer must contain
#   expect:           blocked | refused | approval | citations | cache_hit | no_agents (booleans)
#
# Not here, because they need a process to be killed: "agent down" and "timeout". They are
# live-tested by scripts/smoke_supervisor.py (Web agent stopped) and smoke_synthesis.py.

# ------------------------------------------------------------------------------ normal
- id: n01
  category: normal
  question: How many customers do we have in each country?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: SELECT country, COUNT(*) FROM customers GROUP BY country
- id: n02
  category: normal
  question: How many orders have been placed in total?
  expected_intent: sql
  expected_agents: [sql]
  gold_sql: SELECT COUNT(*) FROM orders
- id: n03
  category: normal
  question: What is the average unit price of our products?
  expected_intent: sql
  expected_agents: [sql]
